<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
 
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="style.css">
 
</head>
 
<body>
 
    <header>
      <nav class="barra_nav d-flex align-items-center justify-content-between">
        <img src="logo.png" alt="logo" class="logo_nav mt-3">
        
        <span class="btn_menu">
            <i class="fa-solid fa-bars fa-2xl" style="color: #f14c80;"></i>
        </span>
        
        <div class="menu">
            <div class="navigation m-5">
                <a href="./produtos.html">Produtos</a>
                <a href="./index.html">Início</a>
                <a href="./contato.html">Contato</a>
            </div>
        </div>
    </nav>
    <div class="barra_nav2"></div>

  </header>
 
    <main>
        <div class="wrapper d-flex justify-content-center align-items-center">
            <div class="form-box login d-flex flex-column">
                <h2>Entrar</h2>
                <form action="#">
                    <div class="input-box">
                        <span class="icon"><ion-icon name="mail"></ion-icon></span>
                        <input type="email" required>
                        <label>E-mail</label>
                    </div>
 
                    <div class="input-box">
                        <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                        <input type="password" required>
                        <label>Senha</label>
                    </div>
 
                    <div class="remember-forgot">
                        <label><input type="checkbox">Lembrar-me</label>
                        <a href="#">Esqueci a senha</a>
                    </div>
                    <div class="log-cad justify-content-center align-items-center d-flex flex-column">
                        <a href="#"
                            class="btn">Entrar</a>
 
                        <div class="Login-resister mt-3">
                            <p>Não tem cadastro?<a href="cadastrar.html" class="register-link">Cadastre-se</a></p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
 
    <footer>
 
    </footer>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

</body>
 
</html>
